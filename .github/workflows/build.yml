name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm@9

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          CI: true

      - name: Lint
        run: pnpm lint
        continue-on-error: false

      - name: Type Check
        run: pnpm --filter @cobble-ui/web-vue exec vue-tsc --noEmit

      - name: Test
        run: pnpm test
        env:
          CI: true

      - name: Build
        run: pnpm build

      - name: Build docs
        run: pnpm docs:build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cobble-ui-build
          path: |
            packages/cobble-ui/dist/
            packages/docs/.vitepress/dist/
          retention-days: 7
